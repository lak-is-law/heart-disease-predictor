<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="96" height="96" x="2" y="2" rx="22" fill="url(#tileGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2.5"/>
  <g transform="translate(50, 48)">
    <!-- Heart outline -->
    <path d="M0 28 C-24 10 -38 -5 -38 -20 C-38 -32 -28 -40 -16 -40 C-7 -40 -2 -34 0 -30 C2 -34 7 -40 16 -40 C28 -40 38 -32 38 -20 C38 -5 24 10 0 28 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" opacity="0.9"/>
    <!-- Glowing ECG Pulse Wave -->
    <polyline points="-42 0 -20 0 -13 0 -7 -9 -2 17 4 -24 9 19 13 -7 17 0 42 0" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)"/>
  </g>
</svg>
