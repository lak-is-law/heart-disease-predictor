<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Llama wearing a nursing cap">
<style>
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.earL{transform-box:fill-box;transform-origin:50% 100%;animation:twL 6s infinite}
.earR{transform-box:fill-box;transform-origin:50% 100%;animation:twR 6s 1.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twL{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-10deg)}}
@keyframes twR{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.eye,.earL,.earR{animation:none}}
</style>
